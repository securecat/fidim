<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIDIM</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-secondary: #262626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-secondary: #c8c8c8;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      width: 220px;
      padding: 16px;
      background: Canvas;
      color: CanvasText;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .toggle-input {
      width: 36px;
      height: 20px;
      appearance: none;
      background: GrayText;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-input:checked {
      background: LinkText;
    }

    .toggle-input::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: Canvas;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
    }

    .toggle-input:checked::after {
      left: 19px;
    }

    .toggle-input:focus-visible {
      outline: 2px solid LinkText;
      outline-offset: 2px;
    }

    .divider {
      border: none;
      border-top: 1px solid GrayText;
      margin-bottom: 12px;
    }

    .exclude-section {
      margin-bottom: 12px;
    }

    .exclude-btn {
      font-family: sans-serif;
      font-size: 16px;
      color: var(--color-secondary);
      background: none;
      border: 1px solid GrayText;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .exclude-btn.is-excluded {
      color: LinkText;
      border-color: LinkText;
    }

    .exclude-btn:focus-visible {
      outline: 2px solid LinkText;
      outline-offset: 2px;
    }

    .footer {
      text-align: right;
    }

    .options-link {
      font-family: sans-serif;
      font-size: 16px;
      color: LinkText;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-decoration: underline;
    }

    .options-link:hover {
      text-decoration-thickness: 3px;
    }

    .options-link:focus-visible {
      outline: 2px solid LinkText;
      outline-offset: 2px;
      border-radius: 2px;
    }

    .no-transition *,
    .no-transition *::before,
    .no-transition *::after {
      transition: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FIDIM</h1>
    <label class="toggle-label">
      <input type="checkbox" class="toggle-input" id="toggle">
      <span id="toggle-label-text">有効</span>
    </label>
  </div>
  <hr class="divider">
  <div class="exclude-section">
    <button class="exclude-btn" id="exclude-btn">このサイトを除外</button>
  </div>
  <div class="footer">
    <button class="options-link" id="options-btn">設定</button>
  </div>
  <script src="popup.js" defer></script>
</body>
</html>
