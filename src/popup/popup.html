<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIDIM</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-bg: #FFFFFF;
      --color-text: #000000;
      --color-focus-ring: #0066CC;
      --color-divider: #6D6D6D;
      --color-toggle-off-bg: #6D6D6D;
      --color-toggle-on-bg: #0066CC;
      --color-toggle-thumb: #FFFFFF;
      --color-exclude-btn-text: #262626;
      --color-exclude-btn-border: #6D6D6D;
      --color-exclude-btn-excluded-text: #0011BF;
      --color-exclude-btn-excluded-border: #0011BF;
      --color-link: #0017c1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121212;
        --color-text: #FFFFFF;
        --color-focus-ring: #9E9EFF;
        --color-divider: #808080;
        --color-toggle-off-bg: #808080;
        --color-toggle-on-bg: #9E9EFF;
        --color-toggle-thumb: #121212;
        --color-exclude-btn-text: #c8c8c8;
        --color-exclude-btn-border: #808080;
        --color-exclude-btn-excluded-text: #9E9EFF;
        --color-exclude-btn-excluded-border: #9E9EFF;
        --color-link: #4DA6FF;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      width: 220px;
      padding: 16px;
      background: var(--color-bg);
      color: var(--color-text);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .toggle-input {
      width: 36px;
      height: 20px;
      appearance: none;
      background: var(--color-toggle-off-bg);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-input:checked {
      background: var(--color-toggle-on-bg);
    }

    .toggle-input::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--color-toggle-thumb);
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
    }

    .toggle-input:checked::after {
      left: 19px;
    }

    .toggle-input:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--color-divider);
      margin-bottom: 12px;
    }

    .exclude-section {
      margin-bottom: 12px;
    }

    .exclude-btn {
      font-family: sans-serif;
      font-size: 16px;
      color: var(--color-exclude-btn-text);
      background: none;
      border: 1px solid var(--color-exclude-btn-border);
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .exclude-btn.is-excluded {
      color: var(--color-exclude-btn-excluded-text);
      border-color: var(--color-exclude-btn-excluded-border);
    }

    .exclude-btn:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    .footer {
      text-align: right;
    }

    .options-link,
    .options-link:visited {
      font-size: 16px;
      color: var(--color-link);
      text-decoration: underline;
    }

    .options-link:hover {
      text-decoration-thickness: 3px;
    }

    .options-link:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .no-transition *,
    .no-transition *::before,
    .no-transition *::after {
      transition: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FIDIM</h1>
    <label class="toggle-label">
      <input type="checkbox" class="toggle-input" id="toggle">
      <span id="toggle-label-text">有効</span>
    </label>
  </div>
  <hr class="divider">
  <div class="exclude-section">
    <button class="exclude-btn" id="exclude-btn">このサイトを除外</button>
  </div>
  <div class="footer">
    <a class="options-link" id="options-link" href="../options/options.html">設定</a>
  </div>
  <script src="popup.js" defer></script>
</body>
</html>
